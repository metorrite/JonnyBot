name: Build Check

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

# A release (PR into master, or the push to master) skips `build` when a green dev push run already built the exact same tree
# (.github/scripts/release_skip.py, docs/CI.md). Every other run builds as before. `ci` is the one job to require.
jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      heavy: ${{ steps.release.outputs.heavy }}
      reason: ${{ steps.release.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Release skip decision tests
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"

      # Not a release: says so and changes nothing. A release: skips only on a tree match with a green dev run that ran `build`.
      - name: Release - skip what dev already proved
        id: release
        run: python3 .github/scripts/release_skip.py --workflow build-test.yml --group "heavy=build"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    needs: decide
    if: needs.decide.outputs.heavy != 'skip'
    runs-on: ubuntu-latest

    # A throwaway database (trust auth, no password: nothing here is a secret) for the headless startup check (StartupWiringTest): it builds the bot's whole service and command wiring
    # without logging in to Discord, and the repositories create their tables on construction.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: startup_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d startup_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STARTUP_CHECK_REQUIRED: "true"
      STARTUP_CHECK_DATABASE_URL: postgresql://ci:@127.0.0.1:5432/startup_check
      # T-135: the tests that run real SQL (LocalDatabase) use their own database in the same throwaway server, so they run here instead of being skipped
      JONNYBOT_TEST_DATABASE_URL: postgresql://ci:@127.0.0.1:5432/local_tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare the BotCommands tables for the startup check
        run: psql -q -f docs/bc-schema.sql "$STARTUP_CHECK_DATABASE_URL"

      - name: Prepare the database for the tests that run real SQL
        run: |
          psql -q -c "CREATE DATABASE local_tests ENCODING 'UTF8' TEMPLATE template0" "$STARTUP_CHECK_DATABASE_URL"
          psql -q -f docs/bc-schema.sql "$JONNYBOT_TEST_DATABASE_URL"

      - name: Verify with Maven
        run: mvn clean verify

  # The single check to require: green when every job above passed or was skipped (a release dev already proved), red otherwise.
  ci:
    needs: [decide, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Why build ran or was skipped
        run: echo "$REASON"
        env:
          REASON: ${{ needs.decide.outputs.reason }}

      - name: All jobs passed or were skipped
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "ok"

      - name: A job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
