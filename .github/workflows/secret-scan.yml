name: Secret Scan

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned release binary, checksum verified. Runs locally on the runner; nothing is uploaded.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # Values are always redacted in the log: rule id, file and commit only.
      - name: Scan the working tree
        run: gitleaks dir . --redact=100 --no-banner --verbose

      - name: Scan the commits of this change
        if: github.event_name == 'pull_request'
        run: gitleaks git . --redact=100 --no-banner --verbose --log-opts="origin/${{ github.base_ref }}..HEAD"
