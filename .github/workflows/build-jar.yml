name: Build JonnyBot Jar

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'Build JonnyBot.jar')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Copy jar to repo root
        run: cp target/JonnyBot.jar JonnyBot.jar

      - name: Commit built jar
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Build JonnyBot.jar"
          file_pattern: JonnyBot.jar
