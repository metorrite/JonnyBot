# The languages JonnyBot can speak: code=name in that language. A language shows on the dashboard's Language page once it is listed here
# AND has an i18n/messages_<code>.properties file. English is built in. See docs/TRANSLATION.md.
en=English

# Machine-drafted packs (T-099): not yet checked by a speaker. They are offered only while LANGUAGE_PACKS_ENABLED=true, may lack keys
# (English shows for those), and their names say they are drafts. Take a code off this list once a speaker has checked its pack.
drafts=de,fr,pt-BR
de=Deutsch (machine-drafted)
fr=Français (machine-drafted)
pt-BR=Português do Brasil (machine-drafted)
